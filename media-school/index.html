<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Медиашкола «Смена контента» переехала на /school</title>
<meta name="description" content="Медиашкола теперь живёт на одной странице /school: заявка, статус и учёба вместе.">
<link rel="canonical" href="https://smenakontenta.ru/school">
<script>location.replace("/school" + (location.search || ""));</script>
<style>body{margin:0;font-family:Arial,sans-serif;background:#f7f5ef;color:#14130f;display:grid;place-items:center;min-height:100vh;text-align:center}a{color:#ff3d14}</style>
</head>
<body>
<main>
<h1>Медиашкола переехала</h1>
<p>Заявка, статус и учёба теперь на одной странице — <a href="/school">smenakontenta.ru/school</a>.</p>
</main>
<script>/* smena-v-check */(function(){if(location.protocol==="file:")return;function go(f){try{if(sessionStorage.getItem("smena-v")===f)return;sessionStorage.setItem("smena-v",f);var u=new URL(location.href);u.searchParams.set("v",f);location.replace(u.href)}catch(e){}}function ck(){try{if(!window.SC||!window.SC.build)return false;if(typeof fetch!=="function")return true;fetch("/assets/js/data.js?nc="+Date.now(),{cache:"no-store"}).then(function(r){return r.text()}).then(function(t){var m=t.match(/build\s*:\s*"([^"]+)"/);if(m&&m[1]&&m[1]!==window.SC.build)go(m[1])}).catch(function(){});return true}catch(e){return true}}var n=0;(function w(){if(ck()||++n>20)return;setTimeout(w,150)})()})();</script></body>
</html>
