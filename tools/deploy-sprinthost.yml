# Как включить: скопировать этот файл на GitHub в .github/workflows/deploy.yml
# (репозиторий → Add file → Create new file → путь .github/workflows/deploy.yml → вставить содержимое).
# Ошибка выкладки или доступность сайта смотрится во вкладке Actions.

name: Выкладка на Sprinthost

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Отправить файлы на хостинг
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /domains/smenakontenta.ru/public_html/
          # что не нужно заливать на сервер
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            tools/**
            README.md
            RELEASE.md
